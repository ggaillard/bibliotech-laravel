# Trois conteneurs : app (Apache + PHP), mysql, phpmyadmin
services:

  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace/projetLaravel
    volumes:
      - .:/workspace
    ports:
      - "8000:80"
    depends_on:
      - mysql

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bibliotech        # base créée automatiquement au premier démarrage
    volumes:
      - mysql-data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"

volumes:
  mysql-data:
