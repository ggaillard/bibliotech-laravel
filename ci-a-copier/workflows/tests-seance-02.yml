name: "Séance 2 – Base de données & Eloquent"

on:
  push:
    paths: ["projetLaravel/**", ".github/workflows/tests-seance-02.yml"]
  pull_request:
    paths: ["projetLaravel/**"]
  workflow_dispatch:

jobs:
  tests:
    name: "🧪 Séance 2 – Base de données & Eloquent"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projetLaravel

    # Même moteur que dans le Codespace : MySQL 8.4
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bibliotech_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: bibliotech_test
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - name: "⚙️ PHP 8.4"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, mbstring, intl
          coverage: none

      - name: "📦 Cache Composer"
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('projetLaravel/composer.lock') }}

      - name: "📦 composer install"
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: "🧪 php artisan test --group=seance-02"
        run: php artisan test --group=seance-02
